<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник прогресса — 10 200</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center top;
            color: #e0e0e0;
            margin: 0;
            padding: 0 15px 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s;
        }

        /* --- РЕЖИМ ФОКУС --- */
        body.focus-mode .sticky-header,
        body.focus-mode .notes-container,
        body.focus-mode .reset-btn {
            display: none !important;
        }
        body.focus-mode { padding-top: 20px; }
        
        .exit-focus-btn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--fill-color);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--fill-glow);
            z-index: 1000;
        }
        body.focus-mode .exit-focus-btn { display: block; }

        /* --- ЦВЕТОВЫЕ ТЕМЫ --- */
        :root { --fill-color: #00e5ff; --fill-glow: rgba(0, 229, 255, 0.6); }
        body.theme-red { --fill-color: #ff5252; --fill-glow: rgba(255, 82, 82, 0.6); }
        body.theme-green { --fill-color: #00ff88; --fill-glow: rgba(0, 255, 136, 0.6); }
        body.theme-orange { --fill-color: #ff9800; --fill-glow: rgba(255, 152, 0, 0.6); }
        body.theme-purple { --fill-color: #e040fb; --fill-glow: rgba(224, 64, 251, 0.6); }
        
        .progress-fill, .counter span { color: var(--fill-color); }
        .progress-fill { background: var(--fill-color); box-shadow: 0 0 10px var(--fill-glow); }

        /* --- ШАПКА --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            max-width: 940px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 14px;
            font-weight: 400;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .rank-title {
            font-size: 18px;
            color: #ffeb3b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.4);
            transition: color 0.3s;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 8px;
        }
        .counter {
            font-size: 32px;
            font-weight: 300;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .counter span { font-weight: 700; }
        .counter.bump { transform: scale(1.05); }
        
        .total-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 12px;
        }

        /* --- ПАНЕЛЬ ИНСТРУМЕНТОВ (Сворачиваемая) --- */
        .toolbar-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 8px 15px;
            font-size: 13px;
            color: #888;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s ease;
            overflow: hidden;
            max-height: 100px; /* Для анимации скрытия */
        }
        .toolbar.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-top: none;
            border-bottom: none;
            opacity: 0;
            margin: 0;
            pointer-events: none;
        }

        /* Кнопка сворачивания */
        .toggle-toolbar-btn {
            width: 100%;
            background: #181818;
            color: #555;
            border: 1px solid #2a2a2a;
            border-radius: 0 0 6px 6px;
            padding: 4px;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: -1px; /* Чтобы прилипала к тулбару */
            z-index: 10;
            transition: 0.2s;
        }
        .toggle-toolbar-btn:hover { color: #fff; }

        .toolbar span { font-weight: bold; font-size: 15px; }
        .today-info span { color: #fff; }
        .timer-text span { color: #ffeb3b; }
        
        .settings-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .settings-btn:hover { background: #333; color: #fff; }

        /* --- БЛОКНОТ --- */
        .notes-container {
            width: 100%;
            max-width: 940px;
            margin-bottom: 20px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
        }
        .notes-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notes-area {
            width: 100%;
            min-height: 80px;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            border-radius: 4px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        .save-note-text { font-size: 11px; color: #00ff88; opacity: 0; transition: opacity 0.3s; }
        .save-note-text.show { opacity: 1; }

        /* --- СЕТКА --- */
        .blocks-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 940px;
            width: 100%;
            justify-content: center;
            margin-bottom: 40px;
        }

        .block {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .block.visible { opacity: 1; transform: translateY(0); }
        .block.completed {
            border-color: var(--fill-glow);
            box-shadow: 0 0 20px var(--fill-glow);
        }
        .block-label {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .block.completed .block-label { color: var(--fill-color); }

        .block-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 3px;
            margin-bottom: 10px;
        }

        .square {
            aspect-ratio: 1 / 1;
            width: 12px;
            height: 12px;
            background: #111;
            border-radius: 2px;
            transition: background 0.2s, transform 0.15s;
            border: 1px solid #222;
            cursor: pointer;
        }
        .square.filled {
            background: var(--fill-color);
            border-color: var(--fill-color);
            box-shadow: 0 0 6px var(--fill-glow);
        }
        .square.pop { animation: popAnim 0.3s ease-out; }
        @keyframes popAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); box-shadow: 0 0 15px var(--fill-color); }
            100% { transform: scale(1); }
        }

        /* --- КНОПКИ --- */
        .controls {
            display: flex;
            width: 100%;
            gap: 5px;
        }
        .add-btn, .minus-btn {
            padding: 8px;
            background: #222;
            color: #888;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .add-btn { flex-grow: 1; }
        .minus-btn { width: 40px; font-size: 16px; }
        
        .add-btn:hover { background: #2a2a2a; color: var(--fill-color); border-color: var(--fill-color); }
        .minus-btn:hover { background: rgba(255, 82, 82, 0.1); color: #ff5252; border-color: #ff5252; }
        .minus-btn:active, .add-btn:active { transform: scale(0.97); }
        
        .add-input {
            width: 40px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 3px;
            text-align: center;
            font-size: 12px;
            padding: 2px;
            outline: none;
        }

        .confetti {
            position: fixed;
            width: 10px; height: 10px;
            background-color: var(--fill-color);
            z-index: 999;
            pointer-events: none;
            border-radius: 50%;
        }

        .reset-btn {
            padding: 10px 24px;
            background: transparent;
            color: #555;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .reset-btn:hover { background: rgba(255, 82, 82, 0.1); color: #ff5252; border-color: #ff5252; }

        @media (max-width: 700px) {
            .block-grid { grid-template-columns: repeat(15, 1fr); }
            .square { width: 10px; height: 10px; }
            .counter { font-size: 26px; }
            .blocks-container { gap: 10px; }
            .block { padding: 8px; }
            .toolbar { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body id="bodyEl">

    <div class="sticky-header">
        <h1>Дневник прогресса</h1>
        <div class="rank-title" id="rankTitle">Новобранец</div>
        
        <div class="stats-container">
            <div class="counter" id="counter"><span id="count">0</span> / 10200</div>
            <div class="total-label">выполнено</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="toolbar-wrapper">
            <div class="toolbar" id="toolbar">
                <div class="today-info">Сегодня: <span id="todayCount">0</span></div>
                <div class="timer-text">Время: <span id="sessionTimer">00:00</span></div>
                
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    <button class="settings-btn" onclick="changeTheme()">Цвет</button>
                    <button class="settings-btn" onclick="toggleFocusMode()">Фокус</button>
                    <button class="settings-btn" onclick="exportProgress()" style="color: #00ff88; border-color: #00ff88;">Экспорт</button>
                    <button class="settings-btn" onclick="triggerImport()" style="color: #ffeb3b; border-color: #ffeb3b;">Импорт</button>
                </div>
            </div>
            <!-- Кнопка сворачивания -->
            <button class="toggle-toolbar-btn" id="toggleToolbarBtn" onclick="toggleToolbar()">▲ Свернуть панель ▲</button>
        </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display:none">
    <button class="exit-focus-btn" onclick="toggleFocusMode()">Выйти</button>

    <div class="notes-container">
        <div class="notes-title">
            <span>Заметки к тренировке</span>
            <span id="saveNoteStatus" class="save-note-text">Сохранено</span>
        </div>
        <textarea id="notesArea" class="notes-area" placeholder="Как прошла тренировка?"></textarea>
    </div>

    <div class="blocks-container" id="blocksContainer"></div>
    <button class="reset-btn" onclick="resetProgress()">Сбросить прогресс</button>

    <script>
        const TOTAL = 10200;
        const BLOCK_SIZE = 300;
        const BLOCKS_COUNT = Math.ceil(TOTAL / BLOCK_SIZE);
        
        const STORAGE_KEY = 'pushupMapStrict10200_v8';
        const NOTES_KEY = 'pushupNotes';
        const THEME_KEY = 'pushupTheme';
        
        let filledCount = 0;
        let todayCount = 0; 
        let timerInterval = null;
        let secondsElapsed = 0;
        let timerStarted = false;

        const blocksContainer = document.getElementById('blocksContainer');
        const countEl = document.getElementById('count');
        const counterEl = document.getElementById('counter');
        const progressFill = document.getElementById('progressFill');
        const todayCountEl = document.getElementById('todayCount');
        const sessionTimerEl = document.getElementById('sessionTimer');
        const rankTitleEl = document.getElementById('rankTitle');
        const notesArea = document.getElementById('notesArea');
        const saveNoteStatus = document.getElementById('saveNoteStatus');
        const bodyEl = document.getElementById('bodyEl');
        const importFile = document.getElementById('importFile');
        const toolbar = document.getElementById('toolbar');
        const toggleToolbarBtn = document.getElementById('toggleToolbarBtn');

        // --- СВОРАЧИВАНИЕ ПАНЕЛИ ---
        function toggleToolbar() {
            toolbar.classList.toggle('collapsed');
            if (toolbar.classList.contains('collapsed')) {
                toggleToolbarBtn.textContent = '▼ Развернуть панель ▼';
            } else {
                toggleToolbarBtn.textContent = '▲ Свернуть панель ▲';
            }
        }

        // --- ЭКСПОРТ / ИМПОРТ ---
        function exportProgress() {
            const squares = document.querySelectorAll('.square');
            const gridData = [];
            squares.forEach(sq => gridData.push(sq.classList.contains('filled') ? 1 : 0));
            
            const data = {
                version: "10200_v1",
                grid: gridData,
                notes: notesArea.value,
                theme: localStorage.getItem(THEME_KEY) || '0'
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Мои_отжимания_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerImport() { importFile.click(); }

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.grid && data.grid.length === TOTAL) {
                        const squares = document.querySelectorAll('.square');
                        filledCount = 0;
                        squares.forEach((sq, index) => {
                            if (data.grid[index] === 1) {
                                sq.classList.add('filled');
                                filledCount++;
                            } else {
                                sq.classList.remove('filled');
                            }
                        });
                        if (data.notes) {
                            notesArea.value = data.notes;
                            localStorage.setItem(NOTES_KEY, data.notes);
                        }
                        if (data.theme) {
                            currentThemeIndex = parseInt(data.theme);
                            applyTheme();
                        }
                        saveProgress();
                        updateCount();
                        for (let b = 0; b < BLOCKS_COUNT; b++) updateBlockCompletion(b);
                        alert('Прогресс успешно загружен!');
                    } else {
                        alert('Ошибка: неверный формат файла.');
                    }
                } catch (error) {
                    alert('Ошибка при чтении файла.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        function toggleFocusMode() { bodyEl.classList.toggle('focus-mode'); }

        // --- ЦВЕТОВЫЕ ТЕМЫ ---
        const themes = ['', 'theme-red', 'theme-green', 'theme-orange', 'theme-purple'];
        let currentThemeIndex = parseInt(localStorage.getItem(THEME_KEY)) || 0;

        function applyTheme() {
            bodyEl.className = bodyEl.className.replace(/theme-\w+/g, '').trim();
            if (themes[currentThemeIndex]) {
                bodyEl.classList.add(themes[currentThemeIndex]);
            }
            localStorage.setItem(THEME_KEY, currentThemeIndex);
        }

        function changeTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme();
            playClickSound(); 
        }
        applyTheme();

        // --- ЗАМЕТКИ ---
        notesArea.value = localStorage.getItem(NOTES_KEY) || '';
        let noteTimeout;
        notesArea.addEventListener('input', () => {
            clearTimeout(noteTimeout);
            saveNoteStatus.classList.remove('show');
            noteTimeout = setTimeout(() => {
                localStorage.setItem(NOTES_KEY, notesArea.value);
                saveNoteStatus.classList.add('show');
                setTimeout(() => saveNoteStatus.classList.remove('show'), 2000);
            }, 500); 
        });

        // --- РАНГИ ---
        const ranks = [
            { threshold: 0, name: 'Новобранец', color: '#888' },
            { threshold: 500, name: 'Боец', color: '#00e5ff' },
            { threshold: 1500, name: 'Атлет', color: '#00ff88' },
            { threshold: 3000, name: 'Терминатор', color: '#ffeb3b' },
            { threshold: 5000, name: 'Машина', color: '#ff9800' },
            { threshold: 7500, name: 'Геракл', color: '#ff5252' },
            { threshold: 10000, name: 'Легенда', color: '#e040fb' }
        ];

        function updateRank(count) {
            let currentRank = ranks[0];
            for (let i = ranks.length - 1; i >= 0; i--) {
                if (count >= ranks[i].threshold) {
                    currentRank = ranks[i];
                    break;
                }
            }
            rankTitleEl.textContent = currentRank.name;
            rankTitleEl.style.color = currentRank.color;
            rankTitleEl.style.textShadow = `0 0 10px ${currentRank.color}66`;
        }

        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                sessionTimerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function saveProgress() {
            const squares = document.querySelectorAll('.square');
            const arr = [];
            squares.forEach(sq => arr.push(sq.classList.contains('filled') ? 1 : 0));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        }

        function resetProgress() {
            if (!confirm('Вы уверены, что хотите сбросить весь прогресс?')) return;
            document.querySelectorAll('.square').forEach(sq => sq.classList.remove('filled'));
            filledCount = 0;
            todayCount = 0;
            updateCount();
            saveProgress();
            document.querySelectorAll('.block').forEach(b => b.classList.remove('completed'));
            todayCountEl.textContent = todayCount;
            updateRank(0);
        }

        function updateCount() {
            countEl.textContent = filledCount;
            todayCountEl.textContent = todayCount;
            const percent = (filledCount / TOTAL) * 100;
            progressFill.style.width = percent + '%';
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 200);
            updateRank(filledCount);
        }

        function triggerConfetti() {
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                const colors = ['#00e5ff', '#ffeb3b', '#ff5252', '#00ff88', '#ffffff'];
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = window.innerWidth / 2 + 'px';
                conf.style.top = window.innerHeight / 2 + 'px';
                document.body.appendChild(conf);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 20 + 5;
                conf.animate([
                    { transform: `translate(0, 0) scale(1)`, opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * velocity * 30}px, ${Math.sin(angle) * velocity * 30 - 100}px) scale(0)`, opacity: 0 }
                ], { duration: Math.random() * 800 + 600, easing: 'cubic-bezier(0, .9, .57, 1)' });
                setTimeout(() => conf.remove(), 1500);
            }
        }

        // --- ГЕНЕРАЦИЯ ---
        const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
        let globalIndex = 0;

        for (let b = 0; b < BLOCKS_COUNT; b++) {
            const block = document.createElement('div');
            block.classList.add('block');
            block.dataset.blockIndex = b;

            const label = document.createElement('div');
            label.classList.add('block-label');
            label.textContent = `${b * BLOCK_SIZE + 1} — ${(b + 1) * BLOCK_SIZE}`;
            block.appendChild(label);

            const blockGrid = document.createElement('div');
            blockGrid.classList.add('block-grid');

            for (let s = 0; s < BLOCK_SIZE; s++) {
                const sq = document.createElement('div');
                sq.classList.add('square');
                sq.dataset.index = globalIndex;
                sq.dataset.block = b;

                if (savedData && savedData[globalIndex] === 1) {
                    sq.classList.add('filled');
                    filledCount++;
                }

                sq.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startTimer();

                    if (sq.classList.contains('filled')) {
                        if (confirm('Снять отметку?')) {
                            sq.classList.remove('filled');
                            filledCount--;
                            if (todayCount > 0) todayCount--;
                            updateCount();
                            saveProgress();
                            updateBlockCompletion(b);
                        }
                    } else {
                        sq.classList.add('filled');
                        filledCount++;
                        todayCount++;
                        sq.classList.remove('pop');
                        void sq.offsetWidth;
                        sq.classList.add('pop');
                        if (navigator.vibrate) navigator.vibrate(20);
                        playClickSound();
                        updateCount();
                        saveProgress();
                        const wasCompleted = block.classList.contains('completed');
                        updateBlockCompletion(b);
                        if (!wasCompleted && block.classList.contains('completed')) triggerConfetti();
                    }
                });

                blockGrid.appendChild(sq);
                globalIndex++;
            }
            block.appendChild(blockGrid);

            // --- КНОПКИ ---
            const controlsDiv = document.createElement('div');
            controlsDiv.classList.add('controls');

            const addBtn = document.createElement('div');
            addBtn.classList.add('add-btn');
            const input = document.createElement('input');
            input.type = 'number';
            input.classList.add('add-input');
            input.value = '1';
            input.min = '1';
            const btnText = document.createElement('span');
            btnText.textContent = 'Добавить';
            addBtn.appendChild(btnText);
            addBtn.appendChild(input);

            const minusBtn = document.createElement('div');
            minusBtn.classList.add('minus-btn');
            minusBtn.textContent = '−';

            // УМНОЕ ДОБАВЛЕНИЕ
            addBtn.addEventListener('click', (e) => {
                if (e.target === input) return; 
                startTimer();
                let amount = parseInt(input.value);
                if (isNaN(amount) || amount < 1) amount = 1;

                const unFilledSquares = Array.from(blockGrid.querySelectorAll('.square:not(.filled)'));
                if (unFilledSquares.length === 0) {
                    btnText.textContent = 'Заполнено';
                    setTimeout(() => { btnText.textContent = 'Добавить'; }, 1000);
                    return;
                }

                const toFill = Math.min(amount, unFilledSquares.length);
                const wasCompleted = block.classList.contains('completed');

                for (let i = 0; i < toFill; i++) {
                    const sq = unFilledSquares[i];
                    setTimeout(() => {
                        sq.classList.add('filled');
                        filledCount++;
                        todayCount++;
                        sq.classList.remove('pop');
                        void sq.offsetWidth;
                        sq.classList.add('pop');
                        if (navigator.vibrate) navigator.vibrate(10); 
                        updateCount();
                        saveProgress();
                        updateBlockCompletion(b);
                        if (i === toFill - 1 && !wasCompleted && block.classList.contains('completed')) {
                            triggerConfetti();
                            playClickSound();
                        }
                    }, i * 30); 
                }
            });

            // УМНЫЙ МИНУС (ЗАЖАТИЕ)
            let minusInterval;
            let minusTimeout;
            let minusSpeed = 150; // Начальная скорость (мс)

            const startMinus = (e) => {
                e.preventDefault();
                // Сначала удаляем один раз
                removeOne();
                
                // Запускаем таймер на ускорение
                minusSpeed = 150;
                minusTimeout = setTimeout(() => {
                    minusInterval = setInterval(() => {
                        removeOne();
                        // Постепенно ускоряем до 20мс
                        if (minusSpeed > 20) minusSpeed -= 10;
                    }, minusSpeed);
                }, 400); // Начало ускорения через 400мс
            };

            const stopMinus = () => {
                clearTimeout(minusTimeout);
                clearInterval(minusInterval);
            };

            const removeOne = () => {
                const filledSquares = Array.from(blockGrid.querySelectorAll('.square.filled'));
                if (filledSquares.length > 0) {
                    const lastFilled = filledSquares[filledSquares.length - 1];
                    lastFilled.classList.remove('filled');
                    filledCount--;
                    if (todayCount > 0) todayCount--;
                    updateCount();
                    saveProgress();
                    updateBlockCompletion(b);
                } else {
                    stopMinus(); // Если всё стерли, останавливаем
                }
            };

            // Обработчики для мыши
            minusBtn.addEventListener('mousedown', startMinus);
            minusBtn.addEventListener('mouseup', stopMinus);
            minusBtn.addEventListener('mouseleave', stopMinus);
            
            // Обработчики для тача (телефон)
            minusBtn.addEventListener('touchstart', startMinus, {passive: false});
            minusBtn.addEventListener('touchend', stopMinus);

            controlsDiv.appendChild(minusBtn);
            controlsDiv.appendChild(addBtn);
            block.appendChild(controlsDiv);
            blocksContainer.appendChild(block);
        }

        function updateBlockCompletion(blockIndex) {
            const block = document.querySelector(`.block[data-block-index="${blockIndex}"]`);
            if (!block) return;
            const squares = block.querySelectorAll('.square');
            const allFilled = Array.from(squares).every(sq => sq.classList.contains('filled'));
            if (allFilled) block.classList.add('completed');
            else block.classList.remove('completed');
        }

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target); 
                }
            });
        }, { threshold: 0.1 });

        for (let b = 0; b < BLOCKS_COUNT; b++) updateBlockCompletion(b);
        updateCount();
        document.querySelectorAll('.block').forEach(block => observer.observe(block));
    </script>
</body>
</html>
